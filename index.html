<style>
:root{--bg:#050b08;--panel:#0a1511;--card:#101d18;--line:#17613a;--g1:#22e06b;--g2:#0fa84a;--tx:#eafff2;--mut:#8fb5a1;--user:#2ee66f;--utx:#04200f}
:root[data-theme=light]{--bg:#eef8f2;--panel:#fff;--card:#f4fbf7;--line:#8fd6ac;--tx:#0b2517;--mut:#4f7562}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
aside{width:270px;flex:none;margin:12px;background:var(--panel);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;padding:18px;gap:6px;overflow:hidden;transition:transform .25s}
.brand{text-align:center;padding:6px 0 14px}
.brand b{display:block;font-size:30px;margin-top:4px}
.brand span{font-size:13px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;width:100%;text-align:left}
.nav:hover{background:var(--card)}
.nav.primary{background:linear-gradient(90deg,var(--g2),var(--g1));color:var(--utx);font-weight:700;justify-content:center;margin-bottom:6px}
#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
#hist .nav{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#hist .nav.on{background:var(--card);color:var(--tx)}
.powered{border:1px solid var(--line);border-radius:18px;padding:12px;font-size:13px;color:var(--mut)}
.powered b{display:block;color:var(--tx);font-size:16px}
main{flex:1;min-width:0;margin:12px 12px 12px 0;border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header .sp{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;background:var(--card)}
#menu{display:none;font-size:22px;padding:4px 10px}
#chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero{border:1px solid var(--line);border-radius:24px;padding:22px;background:radial-gradient(120% 140% at 100% 100%,rgba(34,224,107,.35),transparent 60%),var(--card);display:flex;gap:18px;align-items:center}
.hero h1{font-size:clamp(24px,4vw,40px)}
.hero p{color:var(--mut);margin-top:6px}
.bot{font-size:54px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 16px;font-size:14px}
.chips button:hover{border-color:var(--g1)}
.msg{max-width:min(760px,88%);padding:12px 16px;border-radius:20px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--user);color:var(--utx);font-weight:600;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a code{background:rgba(34,224,107,.15);padding:1px 5px;border-radius:5px}
.msg.a h1,.msg.a h2,.msg.a h3{line-height:1.3;margin:14px 0 7px;color:var(--g1)}
.msg.a h1{font-size:1.45em}.msg.a h2{font-size:1.22em}.msg.a h3{font-size:1.08em}
.msg.a p{margin:7px 0}.msg.a ul,.msg.a ol{padding-left:24px;margin:7px 0}.msg.a li{margin:4px 0}
.msg.a blockquote{border-left:3px solid var(--g1);padding:5px 12px;margin:8px 0;color:var(--mut)}
.msg.a .dl{margin-right:7px}
.msg.a pre{background:#000;color:#b6ffd1;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.msg.a .dl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--g1)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--g1);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
form#f{display:flex;gap:10px;align-items:center;padding:12px 14px 14px;min-width:0}
.box{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--g2);border-radius:999px;padding:6px 8px;background:var(--card)}
textarea{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;resize:none;max-height:120px;padding:9px 0;outline:0}
.ic{width:40px;height:40px;border-radius:50%;font-size:18px}

.image-status{color:var(--mut);font-size:13px;margin-top:6px}
.send{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--utx);font-size:22px;flex:none}

dialog label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
dialog input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
dialog a{color:var(--g1)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.row button{padding:10px 18px;border-radius:999px;border:1px solid var(--line)}
.row .ok{background:var(--g1);color:var(--utx);font-weight:700;border-color:var(--g1)}
#authGate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,rgba(34,224,107,.16),transparent 45%),var(--bg)}
.auth-card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 20px 80px #0005}
.auth-logo{text-align:center;color:var(--g1);font-size:34px;font-weight:800;margin-bottom:5px}.auth-sub{text-align:center;color:var(--mut);margin-bottom:20px}
.auth-card label{display:block;color:var(--mut);font-size:14px;margin:12px 0 5px}.auth-card input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.auth-actions{display:flex;gap:8px;margin-top:18px}.auth-actions button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px}.auth-actions .primary-auth{background:var(--g1);color:#04200f;font-weight:700}
#authMsg{min-height:22px;color:var(--mut);font-size:13px;margin-top:12px;line-height:1.4}#userBar{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;color:var(--mut);font-size:12px}#userName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}#logoutBtn{color:var(--g1);font-weight:700}
@media(max-width:800px){

 #menu{display:block}

}
@media(max-width:520px){

 form#f{padding:8px 9px calc(10px + env(safe-area-inset-bottom));gap:7px;align-items:flex-end}
 .box{min-width:0;gap:2px;padding:4px 5px;border-radius:22px} .box .ic{width:34px;height:38px;flex:0 0 34px}
 textarea{min-width:0;width:100%;font-size:16px;padding:9px 3px;max-height:100px}
 #imgMode{font-size:11px;padding:0 7px;height:32px;flex:0 0 auto} #mic{display:none}
 .send{width:44px;height:44px;flex:0 0 44px;margin-bottom:1px} .pill{padding:7px 10px;font-size:12px}
 .pill.hide{display:none} .msg{max-width:96%;font-size:15px} .hero{gap:8px} .chips button{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic,.send{display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:8px}
#theme .moon{display:none}
:root[data-theme=light] #theme .moon{display:inline}
:root[data-theme=light] #theme .sun{display:none}
.bot{color:var(--g1)}
#atts{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px 0}
#atts:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:400;max-width:230px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.fchip button{display:grid;place-items:center;color:var(--mut)}
.fw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style>

<script>
// Add your Supabase Project URL and Publishable key here (never use service_role in a browser).
const SUPABASE_URL = "https://ipgttxuuzajcnvlvinli.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jtTvZUePsq0num6YmIBOXg_Vs22SeEn";
const OWNER_EMAIL = "muhammadasim9819@gmail.com".toLowerCase();
const supabaseReady = !!(window.supabase && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_"));
const sb = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
let currentUser = null;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let chats=[],cur=null,busy=false;
// The frontend and backend must be served together from Render. GitHub Pages has no /api/chat route.
const CHAT_API = location.hostname.endsWith('github.io') ? null : '/api/chat';
let imageMode=false;
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
 // Render a useful, safe subset of Markdown (headings, paragraphs, lists and code).
 const inline=(value)=>esc(value)
  .replace(/`([^`\n]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
  .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
 const lines=String(t||'').replace(/\r/g,'').split('\n');
 let html='', paragraph=[], listType='', inCode=false, code=[];
 const flushP=()=>{if(paragraph.length){html+='<p>'+inline(paragraph.join(' '))+'</p>';paragraph=[]}};
 const closeList=()=>{if(listType){html+='</'+listType+'>';listType=''}};
 for(const line of lines){
  if(/^```/.test(line.trim())){flushP();closeList();if(inCode){html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];inCode=false}else inCode=true;continue}
  if(inCode){code.push(line);continue}
  let m=line.match(/^(#{1,3})\s+(.+)$/);
  if(m){flushP();closeList();const level=m[1].length;html+='<h'+level+'>'+inline(m[2])+'</h'+level+'>';continue}
  m=line.match(/^\s*[-*+]\s+(.+)$/);
  if(m){flushP();if(listType!=='ul'){closeList();html+='<ul>';listType='ul'}html+='<li>'+inline(m[1])+'</li>';continue}
  m=line.match(/^\s*\d+[.)]\s+(.+)$/);
  if(m){flushP();if(listType!=='ol'){closeList();html+='<ol>';listType='ol'}html+='<li>'+inline(m[1])+'</li>';continue}
  m=line.match(/^>\s?(.*)$/);
  if(m){flushP();closeList();html+='<blockquote>'+inline(m[1])+'</blockquote>';continue}
  if(!line.trim()){flushP();closeList();continue}
  closeList();paragraph.push(line.trim());
 }
 flushP();closeList();if(inCode)html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';
 return html;
}
function cleanMessages(list){return list.map(m=>m.files?{...m,files:m.files.map(f=>({name:f.name,mime:f.mime}))}:m)}
async function save(){
 if(!currentUser)return;
 const local=chats.map(c=>({...c,msgs:cleanMessages(c.msgs)}));
 // Per-user cloud persistence; Supabase RLS ensures users can access only their own rows.
 for(const c of local){
  if(!c.id)c.id=crypto.randomUUID();
  const {error}=await sb.from('chats').upsert({id:c.id,user_id:currentUser.id,title:c.title||'New chat',messages:c.msgs,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(error){console.error('Chat sync failed:',error.message);$('#authMsg').textContent='Chat cloud sync issue: '+error.message;}
 }
 store.set('asim_chats_'+currentUser.id,local);
}
async function loadCloudChats(){
 const {data,error}=await sb.from('chats').select('id,title,messages,created_at,updated_at').eq('user_id',currentUser.id).order('updated_at',{ascending:false});
 if(error)throw error;
 chats=(data||[]).map(r=>({id:r.id,title:r.title||'New chat',msgs:Array.isArray(r.messages)?r.messages:[]}));cur=null;render();
}
function renderHist(){
 const h=$('#hist');h.innerHTML='';
 chats.slice().reverse().forEach(c=>{
  const b=document.createElement('button');b.className='nav'+(c===cur?' on':'');b.textContent=c.title;
  b.onclick=()=>{cur=c;render();$('#side').classList.remove('open')};h.appendChild(b);
 });
}
function addMsg(role,text,files){
 const d=document.createElement('div');d.className='msg '+(role==='user'?'u':'a');
 if(role==='user'){d.textContent=text;fileChips(d,files)}else{d.innerHTML=md(text);
  const a=document.createElement('button');a.className='dl';a.innerHTML='<svg class="i"><use href="#i-dl"/></svg> Download TXT';
  a.onclick=()=>{const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='asim-ai-response.txt';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  const pdf=document.createElement('button');pdf.className='dl';pdf.innerHTML='<svg class="i"><use href="#i-file"/></svg> Save as PDF';
  pdf.onclick=()=>printResponse(text);
  d.appendChild(document.createElement('br'));d.appendChild(a);d.appendChild(pdf);}
 $('#chat').appendChild(d);$('#chat').scrollTop=1e9;return d;
}
function addGeneratedImage(dataUrl,prompt){
 const d=document.createElement('div');d.className='msg a';
 const title=document.createElement('p');title.innerHTML='<b>Generated image</b>';d.appendChild(title);
 const img=document.createElement('img');img.className='generated-image';img.alt=prompt||'AI generated image';img.src=dataUrl;d.appendChild(img);
 const a=document.createElement('a');a.className='dl';a.href=dataUrl;a.download='asim-ai-generated-image.png';a.textContent='⬇ Download image';d.appendChild(a);
 const note=document.createElement('div');note.className='image-status';note.textContent='Created with AI Horde free community workers.';d.appendChild(note);
 $('#chat').appendChild(d);$('#chat').scrollTop=1e9;return d;
}
async function createImage(prompt){
 prompt=(prompt||'').trim();if(!prompt||busy)return;
 if(!cur){cur={id:crypto.randomUUID(),title:('Image: '+prompt).slice(0,40),msgs:[]};chats.push(cur)}
 if(!cur.msgs.length)$('#chat').innerHTML='';
 cur.msgs.push({role:'user',text:'Create an image: '+prompt});addMsg('user','Create an image: '+prompt);
 $('#inp').value='';grow();const w=addMsg('model','');w.innerHTML='<span class="dots"><span></span><span></span><span></span></span><div class="image-status">Sending your request to free community image generators…</div>';
 busy=true;
 try{
  const headers={'Content-Type':'application/json','apikey':'0000000000','Client-Agent':'AsimAI:1.0:public-web-chatbot'};
  const response=await fetch('https://aihorde.net/api/v2/generate/async',{method:'POST',headers,body:JSON.stringify({prompt,params:{width:512,height:512,steps:20,n:1,cfg_scale:7},nsfw:false,censor_nsfw:true,r2:true,shared:false})});
  let data={};try{data=await response.json()}catch(_){data={}}
  if(!response.ok)throw new Error(data.message||data.error||('HTTP '+response.status));
  if(!data.id)throw new Error('AI Horde did not return a generation ID. Please try again.');
  const id=data.id;let finished=false;
  for(let attempt=0;attempt<120;attempt++){
   await new Promise(resolve=>setTimeout(resolve,5000));
   const checkResponse=await fetch('https://aihorde.net/api/v2/generate/check/'+encodeURIComponent(id),{headers:{'apikey':'0000000000','Client-Agent':'AsimAI:1.0:public-web-chatbot'}});
   let check={};try{check=await checkResponse.json()}catch(_){check={}}
   if(!checkResponse.ok)throw new Error(check.message||('Status check failed: HTTP '+checkResponse.status));
   const progress=check.waiting!==undefined?'Queue: '+check.waiting+' waiting · '+(check.processing||0)+' processing · '+(check.finished||0)+' finished':'Waiting for a volunteer GPU…';
   const stat=w.querySelector('.image-status');if(stat)stat.textContent=progress;
   if(check.done===true||Number(check.finished)>0){finished=true;break;}
  }
  if(!finished)throw new Error('The free queue is busy. Your request took too long. Please try again later.');
  const resultResponse=await fetch('https://aihorde.net/api/v2/generate/status/'+encodeURIComponent(id),{headers:{'apikey':'0000000000','Client-Agent':'AsimAI:1.0:public-web-chatbot'}});
  let result={};try{result=await resultResponse.json()}catch(_){result={}}
  if(!resultResponse.ok)throw new Error(result.message||('Could not retrieve image: HTTP '+resultResponse.status));
  const imageUrl=result.generations&&result.generations[0]&&result.generations[0].img;
  if(!imageUrl)throw new Error('The worker finished but did not return an image. Please try another prompt.');
  w.remove();addGeneratedImage(imageUrl,prompt);cur.msgs.push({role:'model',text:'[Generated an image for: '+prompt+']'});save();
 }catch(e){w.remove();addMsg('model','Image generation failed: '+e.message+'\n\nAI Horde is a free community service, so generation can be slow or temporarily unavailable. Try again later.');}
 busy=false;renderHist();
}
function printResponse(text){
 const win=window.open('','_blank');
 if(!win){alert('Please allow pop-ups for Asim AI, then try Save as PDF again.');return}
 const content=md(text);
 win.document.open();
 win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Asim AI Response</title><style>
 body{font-family:Arial,sans-serif;color:#17251c;line-height:1.65;max-width:850px;margin:36px auto;padding:0 28px}
 h1,h2,h3{color:#087a39;line-height:1.3;margin:22px 0 9px}p{margin:9px 0}ul,ol{padding-left:26px}li{margin:5px 0}
 pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f2;padding:12px;border-radius:8px}
 code{background:#eef5ef;padding:2px 4px;border-radius:4px}blockquote{border-left:3px solid #16a34a;padding:4px 14px;color:#44564a}
 .brand{font-size:13px;color:#168044;border-bottom:1px solid #d7e5da;padding-bottom:12px;margin-bottom:22px}
 @media print{body{margin:15mm auto;padding:0}a{color:inherit}}
 </style></head><body><div class="brand"><b>Asim AI</b> · Generated response</div>${content}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);
 win.document.close();
}

function render(){
 const c=$('#chat');c.innerHTML='';
 if(!cur||!cur.msgs.length){
  c.innerHTML='<div class="hero"><div class="bot"><svg class="i" style="width:56px;height:56px"><use href="#i-bot"/></svg></div><div><h1>Hello! I’m Asim Chatbot</h1><p>Ask me anything in your own language.</p></div></div><div class="chips"></div>';
  ['What is Artificial Intelligence?','Write a short email to my teacher','Explain Python in simple words','Mujhe ek motivational quote do'].forEach(q=>{
   const b=document.createElement('button');b.textContent=q;b.onclick=()=>send(q);c.querySelector('.chips').appendChild(b)});
 } else cur.msgs.forEach(m=>addMsg(m.role,m.text,m.files));
 renderHist();
}
function newChat(){cur=null;render();$('#side').classList.remove('open')}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function requestChatBackend(body){
 if(!CHAT_API) throw new Error('Aap GitHub Pages wala link open kar rahe hain. Chat ke liye Render par deploy hone ke baad uska onrender.com link open karein.');
 const {data:{session}} = await sb.auth.getSession();
 if(!session?.access_token) throw new Error('Your login session expired. Please log in again.');
 let response;
 try { response=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)}); }
 catch(networkError) { throw new Error('Backend se connection nahi ho saka. Render dashboard mein service Live check karein aur apna onrender.com link open karein.'); }
 let data={};try{data=await response.json()}catch(_){data={}}
 if(!response.ok){const err=new Error(data.error||('Request failed: HTTP '+response.status));err.status=response.status;throw err;}
 return data;
}
async function send(text){
 text=(text||'').trim();if((!text&&!pending.length)||busy)return;text=text||'Please look at the attached file(s) and help me.';
 if(!currentUser||!sb){showAuth();return}
 if(!cur){cur={id:crypto.randomUUID(),title:text.slice(0,40),msgs:[]};chats.push(cur)}
 if(!cur.msgs.length)$('#chat').innerHTML='';
 const files=pending;pending=[];renderAtts();cur.msgs.push({role:'user',text,files});addMsg('user',text,files);$('#inp').value='';grow();
 const w=addMsg('model','');w.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';busy=true;
 try{
  const body={contents:cur.msgs.map(toParts),systemInstruction:{parts:[{text:"You are Asim AI, a friendly, natural, helpful conversational assistant. Detect the language and writing style of the user's latest message and reply in exactly that language and style. If the user writes Roman Urdu/Hinglish, reply in simple natural Roman Urdu/Hinglish like a friendly Pakistani person; if English, reply in English; if Urdu script, reply in Urdu script. Follow language changes immediately. Never randomly switch to Indonesian or another language. For explanations, study notes, assignments, guides, and long answers, organize the response like a clear ChatGPT answer: start with a meaningful title or main heading, use clear section headings and subheadings, explain in readable paragraphs, and use numbered steps or bullet points wherever helpful. Avoid one huge paragraph. Keep wording simple and well-structured, but make short replies when the user only asks a simple question. Use bold emphasis for important terms when useful. Do not announce which language you detected."}]}};
  const result=await requestChatBackend(body);const answer=String(result.text||'No response. Try rephrasing your question.');
  cur.msgs.push({role:'model',text:answer});await save();w.remove();addMsg('model',answer);
 }catch(e){w.remove();cur.msgs.pop();const detail=e.status===401?'Your login session expired. Please log out and log in again.':e.status===429?'The chatbot is busy. Please wait a little and try again.':e.message;addMsg('model','Asim AI: '+detail)}
 busy=false;renderHist();
}
function grow(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
let pending=[];
function toParts(m){
 const parts=[];
 (m.files||[]).forEach(f=>{
  if(f.data)parts.push({inlineData:{mimeType:f.mime,data:f.data}});
  else if(f.text!=null)parts.push({text:'[File: '+f.name+']\n'+f.text});
  else parts.push({text:'[Earlier attachment: '+f.name+' (no longer available)]'});
 });
 parts.push({text:m.text});
 return {role:m.role==='user'?'user':'model',parts};
}
function chipEl(f,rm){
 const c=document.createElement('div');c.className='fchip';
 if(f.data&&f.mime.startsWith('image/')){const i=document.createElement('img');i.alt='';i.src='data:'+f.mime+';base64,'+f.data;c.appendChild(i)}
 else c.insertAdjacentHTML('beforeend','<svg class="i"><use href="#i-file"/></svg>');
 const s=document.createElement('span');s.textContent=f.name;c.appendChild(s);
 if(rm){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Remove '+f.name);b.innerHTML='<svg class="i" style="width:16px;height:16px"><use href="#i-x"/></svg>';b.onclick=()=>{pending=pending.filter(p=>p!==f);renderAtts()};c.appendChild(b)}
 return c;
}
function renderAtts(){const a=$('#atts');a.innerHTML='';pending.forEach(f=>a.appendChild(chipEl(f,true)))}
function fileChips(d,files){if(!files||!files.length)return;const w=document.createElement('div');w.className='fw';files.forEach(f=>w.appendChild(chipEl(f,false)));d.appendChild(w)}
async function addFiles(list){
 for(const f of list){
  if(f.size>10*1024*1024){alert(f.name+' is larger than 10 MB.');continue}
  const mime=f.type||'';
  const isText=mime.startsWith('text/')||/\.(txt|md|csv|json|js|ts|py|html|css|xml|yml|yaml|java|c|cpp|sql)$/i.test(f.name);
  const media=/^(image|audio|video)\//.test(mime)||mime==='application/pdf';
  if(!isText&&!media){alert(f.name+': this file type is not supported. Use PDF, images, audio, video or text files. For Word or Excel, save as PDF or CSV first.');continue}
  if(isText)pending.push({name:f.name,mime:'text/plain',text:await f.text()});
  else{const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});pending.push({name:f.name,mime,data})}
 }
 renderAtts();
}
$('#plus').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};
$('#inp').addEventListener('paste',e=>{const fs=[...e.clipboardData.files];if(fs.length){e.preventDefault();addFiles(fs)}});
// Automatically route clear image-making requests to the image API, even if
// the user did not manually switch on the Image button.
function isImageRequest(value){
 const t=String(value||'').toLowerCase().trim();
 if(!t)return false;
 // Do not treat requests for a written prompt as requests to render an image.
 if(/\b(prompt|image prompt)\b/.test(t) && /\b(write|give|make|create|suggest|provide)\b/.test(t) && /\b(for|to)\b/.test(t))return false;
 return /\b(generate|create|make|draw|render|design)\b.{0,70}\b(image|picture|pic|photo|photograph|logo|poster|illustration|wallpaper|avatar)\b/.test(t)
  || /\b(image|picture|pic|photo|photograph|logo|poster|illustration|wallpaper|avatar)\b.{0,50}\b(generate|create|make|draw|render)\b/.test(t)
  || /\b(bnao|banao|bana do|tasveer|tasveer bna|tasveer banao|photo bnao|pic bnao|image bnao)\b/.test(t)
  || /تصویر\s*(بناؤ|بناو|بنا دیں|بنائیں)|تصویر بنا/.test(t);
}
function routeMessage(value){
 if(imageMode||isImageRequest(value))createImage(value);
 else send(value);
}
$('#f').onsubmit=e=>{e.preventDefault();routeMessage($('#inp').value)};
$('#imgMode').onclick=()=>{imageMode=!imageMode;$('#imgMode').classList.toggle('active',imageMode);$('#inp').placeholder=imageMode?'Describe the image you want to create…':'Type your message…';$('#imgMode').textContent=imageMode?'✦ Image ON':'✦ Image'};
$('#inp').oninput=grow;
$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:801px)').matches){e.preventDefault();routeMessage($('#inp').value)}};
$('#newBtn').onclick=newChat;
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#clrBtn').onclick=async()=>{if(!confirm('Delete all your chats from this account?'))return;if(currentUser&&sb){const {error}=await sb.from('chats').delete().eq('user_id',currentUser.id);if(error){alert('Could not delete cloud chats: '+error.message);return}}chats=[];cur=null;render();};
$('#theme').onclick=()=>{const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'dark':'light';store.set('asim_theme',l?'dark':'light')};
document.documentElement.dataset.theme=store.get('asim_theme','dark');
function showModel(){$('#modelPill').textContent='Gemini 3.7 Flash'}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const r=new SR();r.lang='ur-PK';r.interimResults=false;let on=false;
 r.onresult=e=>{$('#inp').value+=e.results[0][0].transcript;grow()};
 r.onend=()=>{on=false;$('#mic').classList.remove('rec')};
 $('#mic').onclick=()=>{if(on)r.stop();else{r.start();on=true;$('#mic').classList.add('rec')}};
}else $('#mic').style.display='none';
// Authentication gate: app content remains hidden until a valid Supabase session exists.
function authMessage(message,isError=false){$('#authMsg').textContent=message;$('#authMsg').style.color=isError?'#ff8c8c':'var(--mut)'}
function isOwner(user=currentUser){return !!user && String(user.email||'').toLowerCase()===OWNER_EMAIL;}
function updateOwnerUI(){}
function showApp(user){currentUser=user;updateOwnerUI();$('#authGate').style.display='none';$('#userName').textContent=user.user_metadata?.full_name||user.email||'Account';}
function showAuth(){currentUser=null;updateOwnerUI();$('#authGate').style.display='grid';$('#userName').textContent='Signed out';chats=[];cur=null;$('#chat').innerHTML='';renderHist();}
async function authAction(mode){
 if(!sb){authMessage('Supabase config missing. Paste your Project URL and Publishable key in the two config lines near the top of this file.',true);return;}
 const email=$('#authEmail').value.trim(),password=$('#authPassword').value,name=$('#authName').value.trim();
 if(!email||!password){authMessage('Email and password are required.',true);return;}
 if(mode==='signup'&&!name){authMessage('Please enter your full name to create an account.',true);return;}
 $('#signInBtn').disabled=$('#signUpBtn').disabled=true;authMessage(mode==='signup'?'Creating your account…':'Signing in…');
 try{
  let result;
  if(mode==='signup')result=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
  else result=await sb.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  if(mode==='signup'&&!result.data.session){authMessage('Account created. Check your email to confirm, then log in.');return;}
  const user=result.data.user;if(user){showApp(user);await loadCloudChats();authMessage('Signed in successfully.');}
 }catch(e){authMessage(e.message||'Authentication failed.',true)}
 finally{$('#signInBtn').disabled=$('#signUpBtn').disabled=false;}
}
$('#signInBtn').onclick=()=>authAction('login');$('#signUpBtn').onclick=()=>authAction('signup');
$('#authForm').addEventListener('submit',e=>{e.preventDefault();authAction('login')});
$('#logoutBtn').onclick=async()=>{if(!sb)return;const {error}=await sb.auth.signOut();if(error)alert(error.message);else showAuth();};
showModel();render();
(async()=>{
 if(!sb){showAuth();authMessage('Login service is not configured. Please contact the site owner.',true);return;}
 const {data,error}=await sb.auth.getSession();if(error){showAuth();authMessage(error.message,true);return;}
 if(data.session?.user){showApp(data.session.user);try{await loadCloudChats()}catch(e){authMessage('Could not load chats. Check that the chats table and RLS policies are set up: '+e.message,true)}}else showAuth();
 sb.auth.onAuthStateChange(async(_event,session)=>{
  if(session?.user&&!currentUser){showApp(session.user);try{await loadCloudChats()}catch(e){authMessage(e.message,true)}}
  else if(!session?.user&&currentUser)showAuth();
 });
})();

</script>
